<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Versions d'OwnMac</title>
<meta name="description" content="L'historique des versions d'OwnMac et ce que chacune a changé.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23111'/><rect x='8' y='13' width='16' height='6' rx='3' fill='%23fff'/></svg>">
<style>
:root{--bg:#f4f3ef;--ink:#121212;--soft:#5d5d58;--line:#dfddd5;--card:#fff;--blue:#0a84ff;--r:26px;color-scheme:light}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font:17px/1.55 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit}
a:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
h1,h2{font-family:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:-.025em;line-height:1.05}
.wrap{max-width:760px;margin:0 auto;padding:0 24px}
nav{display:flex;justify-content:space-between;align-items:center;height:64px;font-weight:600}
nav a{text-decoration:none}
nav .back{font-weight:500;color:var(--soft)}
nav .back:hover{color:var(--ink)}
header{padding:48px 0 36px}
h1{font-size:clamp(42px,8vw,64px);font-weight:800}
header p{margin-top:14px;color:var(--soft);font-size:19px}
#list{display:grid;gap:16px;padding-bottom:40px}
.rel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:28px}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.rel h2{font-size:28px;font-weight:800}
.badge{background:#000;color:#fff;font-size:12.5px;font-weight:600;padding:4px 11px;border-radius:999px}
time{display:block;color:var(--soft);font-size:15px;margin-top:4px}
.notes{margin-top:18px;color:var(--soft);font-size:16px;overflow-wrap:anywhere}
.notes p,.notes ul{margin-bottom:12px}
.notes ul{padding-left:20px}
.notes li{margin-bottom:5px}
.notes strong{color:var(--ink)}
.dl{display:inline-flex;align-items:center;margin-top:6px;padding:11px 20px;border-radius:999px;background:#000;color:#fff;font-weight:600;font-size:15px;text-decoration:none}
.state{color:var(--soft)}
.warn{background:#fff3e2;border:1px solid #f6d7ad;border-radius:16px;padding:12px 16px;font-size:15px;color:#7a4a00}
footer{padding:28px 0 52px;color:var(--soft);font-size:14px;border-top:1px solid var(--line)}
@media (max-width:640px){.rel{padding:22px}header{padding:30px 0 26px}}
</style>
</head>
<body>
<div class="wrap">
  <nav><a href="./">OwnMac</a><a class="back" href="./">Retour au site</a></nav>
  <main>
    <header>
      <h1>Versions</h1>
      <p>Tout ce qui a changé dans OwnMac, version après version.</p>
    </header>
    <div id="list" aria-live="polite"><p class="state">Chargement de l'historique…</p></div>
  </main>
  <footer>OwnMac est un projet indépendant, sans lien avec Apple.</footer>
</div>

<script>
(function () {
  var API = 'https://api.github.com/repos/Maanaaa/ownMac/releases?per_page=100';

  // Secours si GitHub ne répond pas (limite de requêtes, hors ligne)
  var FALLBACK = [{
    tag_name: 'v0.1.0',
    published_at: '2026-11-07T18:30:45Z',
    body: "Première version publique d'OwnMac.\n\n**Nécessite** macOS 26 ou plus récent et un Mac Apple Silicon.",
    assets: [{ name: 'OwnMac.zip', browser_download_url: 'https://github.com/Maanaaa/ownMac/releases/download/v0.1.0/OwnMac.zip' }]
  }];

  var list = document.getElementById('list');

  function esc(text) {
    return String(text).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  // Sous-ensemble de Markdown. Le texte est échappé d'abord : les notes ne peuvent pas injecter de HTML.
  function inline(text) { return esc(text).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>'); }

  function notes(body) {
    var html = '', list = false, para = [];
    function flushPara() { if (para.length) { html += '<p>' + para.join('<br>') + '</p>'; para = []; } }
    function closeList() { if (list) { html += '</ul>'; list = false; } }
    (body || '').replace(/\r\n/g, '\n').split('\n').forEach(function (raw) {
      var line = raw.trim();
      if (/^[-*] /.test(line)) {
        flushPara();
        if (!list) { html += '<ul>'; list = true; }
        html += '<li>' + inline(line.slice(2)) + '</li>';
        return;
      }
      closeList();
      if (!line) { flushPara(); return; }
      var heading = line.match(/^#{1,6} +(.*)$/);
      para.push(heading ? '<strong>' + inline(heading[1]) + '</strong>' : inline(line));
    });
    flushPara();
    closeList();
    return html;
  }

  function formatDate(iso) {
    return new Intl.DateTimeFormat('fr-FR', { day: 'numeric', month: 'long', year: 'numeric' }).format(new Date(iso));
  }

  function download(release) {
    var zip = (release.assets || []).filter(function (a) { return a.name === 'OwnMac.zip'; })[0];
    if (!zip || zip.browser_download_url.indexOf('https://github.com/Maanaaa/ownMac/') !== 0) return '';
    return '<a class="dl" href="' + esc(zip.browser_download_url) + '">Télécharger cette version</a>';
  }

  function card(release, i) {
    return '<article class="rel"><div class="top"><h2>' + esc((release.tag_name || '').replace(/^v/, '')) + '</h2>' +
      (i === 0 ? '<span class="badge">Dernière version</span>' : '') + '</div>' +
      '<time datetime="' + esc(release.published_at) + '">' + esc(formatDate(release.published_at)) + '</time>' +
      '<div class="notes">' + notes(release.body) + '</div>' + download(release) + '</article>';
  }

  function render(releases, warning) {
    list.innerHTML = (warning ? '<p class="warn">' + esc(warning) + '</p>' : '') + releases.map(card).join('');
  }

  fetch(API, { headers: { Accept: 'application/vnd.github+json' } })
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function (data) {
      var published = data.filter(function (r) { return !r.draft && !r.prerelease; });
      if (!published.length) throw new Error('vide');
      render(published);
    })
    .catch(function () {
      render(FALLBACK, "L'historique complet n'a pas pu être chargé. Certaines versions récentes peuvent manquer.");
    });
})();
</script>
</body>
</html>
